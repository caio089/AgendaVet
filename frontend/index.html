<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaVet — Dashboard</title>

  <!-- Tailwind CSS via CDN (sem build step — ideal para projeto acadêmico) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <!-- Toast de feedback (preenchido via JavaScript) -->
  <div id="toast" class="hidden opacity-0" role="status" aria-live="polite"></div>

  <div class="flex min-h-screen">

    <!-- Sidebar de navegação entre módulos -->
    <aside class="sidebar-scroll w-64 shrink-0 bg-teal-800 text-teal-50">
      <div class="border-b border-teal-700 px-6 py-6">
        <p class="text-xs uppercase tracking-widest text-teal-200">Sistema Acadêmico</p>
        <h1 class="mt-1 text-2xl font-bold text-white">AgendaVet</h1>
        <p class="mt-2 text-sm text-teal-100">Gestão de clínica veterinária</p>
      </div>

      <nav class="space-y-1 p-4">
        <a data-nav href="index.html" class="block rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-teal-700">Dashboard</a>
        <a data-nav href="pages/tutores.html" class="block rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-teal-700">Tutores</a>
        <a data-nav href="pages/animais.html" class="block rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-teal-700">Animais</a>
        <a data-nav href="pages/veterinarios.html" class="block rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-teal-700">Veterinários</a>
        <a data-nav href="pages/consultas.html" class="block rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-teal-700">Consultas</a>
      </nav>

      <div id="user-panel" class="border-t border-teal-700 p-4 text-xs"></div>
      <button id="btn-logout" type="button" class="mx-4 mb-4 block w-[calc(100%-2rem)] rounded-lg border border-teal-600 px-3 py-2 text-sm text-teal-100 hover:bg-teal-700">
        Sair
      </button>

    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-1 overflow-auto p-6 lg:p-10">
      <header class="mb-8">
        <h2 class="text-3xl font-bold text-slate-900">Dashboard</h2>
      </header>

      <!-- Cards de estatísticas -->
      <section id="stats-cards" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></section>

      <!-- Consultas recentes -->
      <section class="mt-8 rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">
        <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
          <h3 class="text-lg font-semibold">Consultas recentes</h3>
          <a href="pages/consultas.html" class="text-sm font-medium text-teal-700 hover:text-teal-900">Ver todas →</a>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-4 py-3 font-medium">Animal / Tutor</th>
                <th class="px-4 py-3 font-medium">Veterinário</th>
                <th class="px-4 py-3 font-medium">Data</th>
                <th class="px-4 py-3 font-medium">Status</th>
              </tr>
            </thead>
            <tbody id="recent-consultas"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
